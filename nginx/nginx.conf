# nginx/nginx.conf

events {}

http {
    server {
        listen 80;

        # Serve files at /cdn/*
        location /cdn/ {
            alias /reelix/;
            autoindex on;
            add_header Cache-Control "public, max-age=31536000";
        }

        location /cdn/hls/ {
            alias /tmp/hls/;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
                video/mp4 mp4;
            }

            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin *;
        }
    }
}
